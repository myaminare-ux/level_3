<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <title>애니메이션 키프레임(장면)</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/keyframes01.css">
    <script src="./scripts/keyframes01.js" defer></script>
</head>
<body>
    <h1>목표1) 좌(0)->우(600px) 이동 애니메이션</h1>
    <div class="map map1">
        <span class="ball"></span>
    </div>
    <h1>목표2) 우(400px)->좌(50px) 이동 애니메이션</h1>
    <div class="map map2">
        <span class="ball"></span>
    </div>
    <h1>목표3) 좌(0)->우(400px)->좌(200px) 이동 + 회전 애니메이션</h1>
    <div class="map map3">
        <span class="ball"><img src="https://cdn-icons-png.flaticon.com/128/7759/7759565.png" alt="공"></span>
    </div>
    <h1>목표4) 글자 한줄씩 나타나는 애니메이션</h1>
    <div class="map map4">
        <span class="txt1">매트를 바꾸는 것이 아니라</span>
        <span class="txt2">생활을 바꾸는 선택입니다.</span>
    </div>
    <h1>목표5) 한 글자씩 나타나는 애니메이션</h1>
    <div class="map map5">
        <span class="txt1">포</span>
        <span class="txt2">트</span>
        <span class="txt3">폴</span>
        <span class="txt4">리</span>
        <span class="txt5">오</span>
    </div>
    <h1>목표6) 무한반복 배경 애니메이션</h1>
    <div class="map map6">
        <span class="bg"></span>
    </div>
</body>
</html>
